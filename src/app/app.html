@if (authService.user()) {
  <div class="app-container">
    <header style="padding: 1rem; background: #f0f0f0; display: flex; justify-content: space-between; align-items: center;">
      <span>Zalogowano jako: <strong>{{ authService.user()?.displayName }}</strong></span>
      <button (click)="authService.logout()" style="padding: 5px 10px; cursor: pointer;">Wyloguj</button>
    </header>
    <main>
      <router-outlet />
    </main>
  </div>
} @else {
  <app-login />
}
